<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booklet - Book Details</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/details.css">
</head>
<body>
    <header>
        <div class="container">
            <nav class="nav-bar">
                <a href="index.html" class="logo">Booklet</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="management.html">Book Management</a></li>
                </ul>
                <button class="mobile-nav-toggle" aria-label="Toggle navigation">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="book-details-container">
                <div class="details-header">
                    <h1 class="book-title">The Midnight Library</h1>
                    <p class="book-author">by Matt Haig</p>
                </div>

                <p class="book-price">$14.99</p>

                <div class="book-meta">
                    <span class="book-category">Fiction</span>
                    <span class="book-rating">4/5 Rating</span>
                </div>

                <div class="book-stats">
                    <div class="stat">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        <div class="stat-text">
                            <strong>Published</strong>
                            <span>2020-09-13</span>
                        </div>
                    </div>
                    <div class="stat">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                        <div class="stat-text">
                            <strong>Pages</strong>
                            <span>304</span>
                        </div>
                    </div>
                </div>

                <div class="book-actions">
                    <a href="management.html" class="btn btn-secondary">Back to Management</a>
                    <a href="edit.html" class="btn">Edit Book</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Booklet. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
