<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booklet - Book Details</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/details.css">
</head>
<body>
    <header>
        <div class="container">
            <nav class="nav-bar">
                <a href="index.html" class="logo">Booklet</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="management.html">Book Management</a></li>
                </ul>
                <button class="mobile-nav-toggle" aria-label="Toggle navigation">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="book-details-container">
                <div class="book-cover-placeholder">
                    <span>Book Cover</span>
                </div>
                <div class="book-info">
                    <h1 class="book-title">The Midnight Library</h1>
                    <p class="book-author">by Matt Haig</p>
                    <p class="book-price">$14.99</p>

                    <div class="book-meta">
                        <span class="book-category">Fiction</span>
                        <span class="book-rating">4/5 Rating</span>
                    </div>

                    <div class="book-stats">
                        <div class="stat">
                            <strong>Published:</strong> 2020-09-13
                        </div>
                        <div class="stat">
                            <strong>Pages:</strong> 304
                        </div>
                    </div>

                    <div class="book-actions">
                        <a href="management.html" class="btn btn-secondary">Back to Management</a>
                        <a href="edit.html" class="btn">Edit Book</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Booklet. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
